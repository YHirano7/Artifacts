name: static-html-book

on:
  push:
    paths:
      - "skills/static-html-book/**"
      - ".github/workflows/static-html-book.yml"
  pull_request:
    paths:
      - "skills/static-html-book/**"
      - ".github/workflows/static-html-book.yml"
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r skills/static-html-book/scripts/requirements.txt
      - name: Install Playwright (browser check)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Unit tests
        working-directory: skills/static-html-book
        env:
          BROWSER_CHECK: "1"
        run: python -m unittest discover -s tests -v
      - name: Build and verify template book
        working-directory: skills/static-html-book
        run: |
          python scripts/build.py --book template --out /tmp/site
          python scripts/check.py --site /tmp/site --strict
          python scripts/browser_check.py --site /tmp/site
          python scripts/public_check.py --book template
      - name: Validate skill package
        run: python .github/scripts/validate_skill.py skills/static-html-book
