<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{chapter_title}} | {{book_title}}</title>
<meta name="description" content="{{chapter_summary}}">
<link rel="stylesheet" href="../assets/book.css">
<script>document.documentElement.className += " js";</script>
<script src="../assets/book.js" defer></script>
</head>
<body class="page-chapter" data-chapter="{{chapter_no}}">
<a class="skip-link" href="#main">本文へスキップ</a>
<input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="チャプター一覧を開閉">
<header class="topbar">
  <label for="nav-toggle" class="menu-btn" title="チャプター一覧"><span class="menu-icon" aria-hidden="true"></span><span class="menu-text">チャプター</span></label>
  <a class="topbar-title" href="../index.html">{{book_title}}</a>
  <span class="topbar-chapter" id="topbar-chapter">Chapter {{chapter_no_padded}}</span>
</header>
<div class="book-layout">
  <aside class="book-sidebar" id="sidebar" aria-label="チャプター一覧">
    <a class="side-book" href="../index.html">
      <span class="mini-cover" aria-hidden="true"><span class="mini-cover-title">{{mini_cover_title}}</span></span>
      <span class="side-book-title">{{book_title}}</span>
    </a>
    <nav>
      <ol class="chapter-list">
{{chapter_list}}
      </ol>
    </nav>
  </aside>
  <label for="nav-toggle" class="scrim" aria-hidden="true"></label>
  <main id="main" class="book-main" tabindex="-1">
    <article class="chapter-card">
      <header class="chapter-head">
        <p class="chapter-label">Chapter {{chapter_no_padded}}</p>
        <h1 class="chapter-title">{{chapter_title}}</h1>
        <p class="chapter-meta">読了目安 約{{reading_minutes}}分</p>
        <details class="toc-inline">
          <summary>このチャプターの目次</summary>
{{toc}}
        </details>
      </header>
      <div class="chapter-body znc">
{{body}}
      </div>
    </article>
    <nav class="pager" aria-label="チャプター移動">
{{pager}}
    </nav>
  </main>
  <aside class="page-toc" id="page-toc" aria-label="このチャプターの目次">
    <div class="toc-card">
      <p class="toc-heading">目次</p>
{{toc}}
    </div>
  </aside>
</div>
<footer class="site-footer">
  <p>{{book_title}} ／ 最終更新 {{updated}}</p>
{{footer_note_html}}
</footer>
</body>
</html>
