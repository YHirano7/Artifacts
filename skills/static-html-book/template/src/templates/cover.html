<div class="cover-main">
  <div class="book-hero">
    <div class="book-cover" aria-hidden="true">
      <div class="cover-inner">
        <span class="cover-kicker">Book</span>
        <span class="cover-title">{{cover_title}}</span>
        {{cover_sub_html}}
        <span class="cover-grid"></span>
      </div>
    </div>
    <div class="book-info">
      <p class="book-kicker">本</p>
      <h1 class="book-title">{{book_title}}</h1>
      <p class="book-subtitle">{{book_subtitle}}</p>
      <ul class="book-meta">
        <li><span class="meta-key">チャプター</span><span class="meta-val">{{chapter_count}}</span></li>
        <li><span class="meta-key">読了目安</span><span class="meta-val">約{{total_hours}}</span></li>
        <li><span class="meta-key">最終更新</span><span class="meta-val">{{updated}}</span></li>
      </ul>
      <p class="book-actions"><a class="btn-primary" href="{{first_chapter_href}}">本を読む</a><a class="btn-ghost" href="#chapters">チャプター一覧</a></p>
    </div>
  </div>
  <section class="book-about">
    <h2 class="index-h2">この本について</h2>
    <div class="about-body znc">
{{book_description}}
    </div>
  </section>
  <section class="book-chapters" id="chapters">
    <h2 class="index-h2">チャプター</h2>
    <ol class="index-chapter-list">
{{chapter_cards}}
    </ol>
  </section>
</div>
